name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Frontend, Test & Clippy (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux WebKitGTK / GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Verify frontend syntax, assets & dynamic code guards
        run: node scripts/verify_frontend.js

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings

  verify-windows:
    name: Windows Test & Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify frontend syntax & assets
        run: node scripts/verify_frontend.js

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings
