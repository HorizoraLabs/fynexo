[package]
name = "fynexo"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.37.2"
wry = "0.57.1"

# Execute JSON Communications
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


