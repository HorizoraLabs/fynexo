[package]
name = "fynexo"
version = "0.1.0"
edition = "2021"

[lib]
name = "fynexo"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.cargo-android]
app-activity-name = "com.horizoralabs.fynexo.MainActivity"
app-dependencies = [
    "androidx.webkit:webkit:1.6.1",
    "androidx.appcompat:appcompat:1.7.1",
    "com.google.android.material:material:1.12.0",
    "androidx.activity:activity-ktx:1.10.1",
    "androidx.lifecycle:lifecycle-process:2.10.0",
]
project-dependencies = []
app-plugins = []
app-permissions = [ "android.permission.INTERNET" ]
app-theme-parent = "Theme.MaterialComponents.DayNight.NoActionBar"
vulkan-validation = false

[package.metadata.cargo-android.env-vars]
WRY_ANDROID_PACKAGE = "com.horizoralabs.fynexo"
WRY_ANDROID_LIBRARY = "fynexo"
WRY_ANDROID_KOTLIN_FILES_OUT_DIR = "<android-project-dir>/app/src/main/kotlin/com/horizoralabs/fynexo"

[dependencies]
tao = "0.37.2"
wry = "0.57.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.0"
paste = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
