<!DOCTYPE html>
<html lang="zh-CN" data-fynexo-internal="newtab">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Start page — Fynexo</title>
    <style>
        :root {
            --fnx-bg: #19191c;
            --fnx-panel: #29292e;
            --fnx-surface: #212126;
            --fnx-elevated: #35353c;
            --fnx-border: #37373f;
            --fnx-border-hover: #4b4b56;
            --fnx-fg: #f0f0f3;
            --fnx-secondary: #c2c2cb;
            --fnx-muted: #8a8a95;
            --fnx-accent: #7a88f7;
            --fnx-accent-bg: #262942;
            --fnx-hover: #33333a;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            box-shadow: none !important;
            text-shadow: none !important;
            backdrop-filter: none !important;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--fnx-bg);
            color: var(--fnx-fg);
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        button, input, a {
            font-family: inherit;
            touch-action: manipulation;
        }

        #__fynexo_newtab_app__ {
            width: 100%;
            min-height: 100vh;
            padding-top: calc(var(--fnx-host-top-offset, 38px) + 18px);
            padding-bottom: 48px;
            padding-left: 24px;
            padding-right: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nt-shell {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 34px;
        }

        .nt-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nt-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .nt-mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: var(--fnx-accent-bg);
            border: 1px solid var(--fnx-accent);
            color: var(--fnx-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nt-clock {
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--fnx-secondary);
            font-variant-numeric: tabular-nums;
        }

        .nt-status-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nt-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 10px;
            border-radius: 7px;
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border);
            color: var(--fnx-secondary);
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
        }
        .nt-pill:hover {
            border-color: var(--fnx-border-hover);
            background: var(--fnx-surface);
            color: var(--fnx-fg);
        }
        .nt-pill.active {
            border-color: var(--fnx-accent);
            background: var(--fnx-accent-bg);
            color: var(--fnx-fg);
        }

        .nt-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            flex-shrink: 0;
        }
        .nt-dot.off {
            background: var(--fnx-muted);
        }

        .nt-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 22px;
        }

        .nt-wordmark {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            user-select: none;
        }

        .nt-title {
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -0.035em;
            color: var(--fnx-fg);
            line-height: 1.15;
        }

        .nt-subtitle {
            font-size: 12.5px;
            color: var(--fnx-muted);
            letter-spacing: -0.005em;
        }

        .nt-search-wrap {
            width: 100%;
            max-width: 640px;
            position: relative;
        }

        .nt-search-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 9px;
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border-hover);
            border-radius: 12px;
            transition: border-color 0.12s ease, background 0.12s ease;
        }
        .nt-search-box:focus-within {
            border-color: var(--fnx-accent);
            background: var(--fnx-surface);
        }

        .nt-engine-btn {
            height: 32px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--fnx-border);
            background: var(--fnx-surface);
            color: var(--fnx-fg);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: border-color 0.12s ease, background 0.12s ease;
        }
        .nt-engine-btn:hover {
            border-color: var(--fnx-border-hover);
            background: var(--fnx-elevated);
        }

        .nt-search-input {
            flex: 1;
            min-width: 0;
            height: 32px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--fnx-fg);
            font-size: 14.5px;
            letter-spacing: -0.01em;
        }
        .nt-search-input::placeholder {
            color: var(--fnx-muted);
        }

        .nt-clear-btn {
            width: 26px;
            height: 26px;
            border: none;
            background: transparent;
            color: var(--fnx-muted);
            border-radius: 6px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .nt-clear-btn:hover {
            color: var(--fnx-fg);
            background: var(--fnx-hover);
        }

        .nt-go-btn {
            width: 34px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: var(--fnx-accent);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.12s ease;
        }
        .nt-go-btn:hover {
            opacity: 0.92;
        }

        .nt-suggest {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border-hover);
            border-radius: 11px;
            overflow: hidden;
            display: none;
            flex-direction: column;
            z-index: 60;
        }

        .nt-suggest-item {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--fnx-border);
            background: transparent;
            color: var(--fnx-fg);
            padding: 9px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            cursor: pointer;
            outline: none;
        }
        .nt-suggest-item:last-child {
            border-bottom: none;
        }
        .nt-suggest-item:hover,
        .nt-suggest-item.selected {
            background: var(--fnx-hover);
        }

        .nt-suggest-mono {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--fnx-surface);
            border: 1px solid var(--fnx-border);
            color: var(--fnx-secondary);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nt-suggest-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .nt-suggest-title {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--fnx-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nt-suggest-url {
            font-size: 11px;
            color: var(--fnx-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nt-suggest-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--fnx-surface);
            border: 1px solid var(--fnx-border);
            color: var(--fnx-muted);
            flex-shrink: 0;
        }

        .nt-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .nt-sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .nt-sec-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--fnx-muted);
        }

        .nt-mini-btn {
            padding: 4px 9px;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--fnx-secondary);
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
        }
        .nt-mini-btn:hover {
            border-color: var(--fnx-border-hover);
            background: var(--fnx-surface);
            color: var(--fnx-fg);
        }

        .nt-add-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border);
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .nt-add-bar.open {
            display: flex;
        }

        .nt-field {
            flex: 1;
            min-width: 150px;
            height: 32px;
            padding: 0 10px;
            background: var(--fnx-surface);
            border: 1px solid var(--fnx-border);
            border-radius: 7px;
            color: var(--fnx-fg);
            font-size: 12.5px;
            outline: none;
        }
        .nt-field:focus {
            border-color: var(--fnx-accent);
            background: var(--fnx-bg);
        }

        .nt-save-btn {
            height: 32px;
            padding: 0 12px;
            border-radius: 7px;
            border: 1px solid var(--fnx-accent);
            background: var(--fnx-accent);
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .bm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 10px;
            width: 100%;
        }

        .bm-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border);
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            min-width: 0;
            transition: border-color 0.12s ease, background 0.12s ease;
        }
        .bm-card:hover {
            border-color: var(--fnx-border-hover);
            background: var(--fnx-hover);
        }

        .bm-mono {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--fnx-surface);
            border: 1px solid var(--fnx-border);
            color: var(--fnx-accent);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .bm-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .bm-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--fnx-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bm-host {
            font-size: 11px;
            color: var(--fnx-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bm-del {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: var(--fnx-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            flex-shrink: 0;
            transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
        }
        .bm-card:hover .bm-del {
            opacity: 0.85;
        }
        .bm-del:hover {
            opacity: 1 !important;
            background: var(--fnx-elevated);
            color: var(--fnx-fg);
        }

        .hist-list {
            display: flex;
            flex-direction: column;
            background: var(--fnx-panel);
            border: 1px solid var(--fnx-border);
            border-radius: 10px;
            overflow: hidden;
        }

        .hist-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 13px;
            border: none;
            border-bottom: 1px solid var(--fnx-border);
            background: transparent;
            color: var(--fnx-fg);
            text-align: left;
            cursor: pointer;
            width: 100%;
            transition: background 0.1s ease;
        }
        .hist-row:last-child {
            border-bottom: none;
        }
        .hist-row:hover {
            background: var(--fnx-hover);
        }

        .hist-mono {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--fnx-surface);
            border: 1px solid var(--fnx-border);
            color: var(--fnx-secondary);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .hist-title {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--fnx-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .hist-host {
            font-size: 11.5px;
            color: var(--fnx-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
            flex-shrink: 0;
        }

        .hist-time {
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: 10.5px;
            color: var(--fnx-muted);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            #__fynexo_newtab_app__ {
                padding-top: calc(var(--fnx-host-top-offset, 0px) + 16px);
                padding-bottom: calc(var(--fnx-host-bottom-offset, 54px) + max(env(safe-area-inset-bottom, 0px), 12px) + 24px);
                padding-left: 14px;
                padding-right: 14px;
            }
            .nt-shell { gap: 26px; }
            .nt-hero { margin-top: 8px; gap: 14px; }
            .nt-title { font-size: 23px; }
            .bm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px; }
            .bm-del { opacity: 0.75; }
            .hist-host { display: none; }
        }
    </style>
    <style id="__fynexo_newtab_custom_css__"></style>
</head>
<body>
    <div id="__fynexo_newtab_app__">
        <div class="nt-shell">
            <header class="nt-topbar">
                <div class="nt-brand">
                    <div class="nt-mark" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                            <path d="M3.5 3.5H12.5M3.5 8H10M3.5 3.5V12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="11.5" r="1.6" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="nt-clock" id="ntClock">--:--</span>
                </div>

                <div class="nt-status-group">
                    <button type="button" class="nt-pill" id="btnIncogPill" title="Toggle Private mode (pauses history & session writes)">
                        <span id="ntIncogText">Private: Off</span>
                    </button>
                    <button type="button" class="nt-pill" id="btnShieldPill" title="Configure network ad & tracker blocker">
                        <span class="nt-dot" id="ntShieldDot"></span>
                        <span id="ntShieldText">Adblock active</span>
                    </button>
                    <button type="button" class="nt-pill" id="btnOpenPrefs">Preferences</button>
                </div>
            </header>

            <section class="nt-hero">
                <div class="nt-wordmark">
                    <h1 class="nt-title" id="ntTitle">Fynexo</h1>
                    <p class="nt-subtitle" id="ntSubtitle">Single-WebView studio browser · Zero-FX compositing</p>
                </div>

                <div class="nt-search-wrap">
                    <div class="nt-search-box">
                        <button type="button" class="nt-engine-btn" id="ntEngineBtn" title="Switch search engine">Google</button>
                        <input type="text" id="ntSearchInput" class="nt-search-input" autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="go" placeholder="Search Google, type !gh / !yt, or enter URL...">
                        <button type="button" class="nt-clear-btn" id="ntClearBtn" title="Clear">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" fill="currentColor" fill-opacity="0.22"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                        </button>
                        <button type="button" class="nt-go-btn" id="ntGoBtn" title="Navigate">
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 8h9M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                    <div class="nt-suggest" id="ntSuggestList"></div>
                </div>
            </section>

            <section class="nt-section" id="shortcutsSection">
                <div class="nt-sec-head">
                    <span class="nt-sec-label">Saved shortcuts</span>
                    <button type="button" class="nt-mini-btn" id="btnToggleAddBm">+ Add shortcut</button>
                </div>

                <div class="nt-add-bar" id="addBmBar">
                    <input type="text" id="addBmTitle" class="nt-field" placeholder="Title (optional)" style="max-width: 200px;">
                    <input type="text" id="addBmUrl" class="nt-field" placeholder="URL (e.g. news.ycombinator.com)">
                    <button type="button" class="nt-save-btn" id="btnSaveBm">Save</button>
                </div>

                <div class="bm-grid" id="bmGrid"></div>
            </section>

            <section class="nt-section" id="histSection" style="display: none;">
                <div class="nt-sec-head">
                    <span class="nt-sec-label">Continue browsing</span>
                    <button type="button" class="nt-mini-btn" id="btnClearHist">Clear history</button>
                </div>
                <div class="hist-list" id="histList"></div>
            </section>
        </div>
    </div>

    <script>
        const DEFAULT_ENGINES = [
            { id: 'google', name: 'Google', url: 'https://www.google.com/search?q={query}' },
            { id: 'duckduckgo', name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q={query}' },
            { id: 'bing', name: 'Bing', url: 'https://www.bing.com/search?q={query}' },
            { id: 'baidu', name: 'Baidu', url: 'https://www.baidu.com/s?wd={query}' }
        ];
        const DEFAULT_BANGS = [
            { trigger: '!gh', name: 'GitHub', url: 'https://github.com/search?q={query}' },
            { trigger: '!yt', name: 'YouTube', url: 'https://www.youtube.com/results?search_query={query}' },
            { trigger: '!b', name: 'Bilibili', url: 'https://search.bilibili.com/all?keyword={query}' },
            { trigger: '!w', name: 'Wikipedia', url: 'https://en.wikipedia.org/w/index.php?search={query}' },
            { trigger: '!rd', name: 'Reddit', url: 'https://www.reddit.com/search/?q={query}' },
            { trigger: '!tr', name: 'Translate', url: 'https://translate.google.com/?sl=auto&tl=zh-CN&text={query}' }
        ];

        const boot = __FNX_BOOT_JSON__ || {};
        let config = Object.assign({
            theme: 'dark',
            enforce_perf: true,
            adblock: true,
            restore_session: true,
            force_dark: false,
            incognito: false,
            search_engine: 'google',
            homepage: 'fynexo://newtab',
            search_engines: DEFAULT_ENGINES,
            bangs: DEFAULT_BANGS
        }, boot.config || {});
        let styles = boot.styles || {};
        let activeTheme = boot.active_theme || {};
        let bookmarks = Array.isArray(boot.bookmarks) ? boot.bookmarks : [];
        let historyItems = Array.isArray(boot.history) ? boot.history : [];
        let blockedAds = Number(boot.blocked_ads) || 0;

        function getEngines() {
            return (Array.isArray(config.search_engines) && config.search_engines.length > 0)
                ? config.search_engines
                : DEFAULT_ENGINES;
        }

        function getBangs() {
            return Array.isArray(config.bangs) ? config.bangs : DEFAULT_BANGS;
        }

        function currentEngineObj(engineId) {
            const list = getEngines();
            const target = engineId || config.search_engine;
            for (let i = 0; i < list.length; i++) {
                if (list[i] && list[i].id === target) return list[i];
            }
            return list[0] || DEFAULT_ENGINES[0];
        }

        function sendIpc(data) {
            const raw = JSON.stringify(data);
            if (window.ipc && typeof window.ipc.postMessage === 'function') {
                window.ipc.postMessage(raw);
            } else if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.ipc) {
                window.__TAURI_INTERNALS__.ipc.postMessage(raw);
            }
        }

        function formatHost(u) {
            try {
                return new URL(u).hostname.replace(/^www\./, '') || u;
            } catch (_) {
                return u || '';
            }
        }

        function monogramOf(url, title) {
            try {
                const h = new URL(url).hostname.replace(/^(www|m)\./, '');
                if (h) return h.charAt(0).toUpperCase();
            } catch (_) {}
            const t = (title || '').trim();
            return t ? t.charAt(0).toUpperCase() : '•';
        }

        function relativeTime(ts) {
            if (!ts) return '';
            const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(ts));
            if (diff < 60) return 'now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h';
            return Math.floor(diff / 86400) + 'd';
        }

        function fillTpl(tpl, q) {
            const s = String(tpl || 'https://www.google.com/search?q={query}');
            if (s.includes('{query}')) return s.split('{query}').join(q);
            if (s.includes('%s')) return s.split('%s').join(q);
            return s + q;
        }

        function resolveQuery(raw, engine) {
            raw = (raw || '').trim();
            if (!raw) return '';
            if (/^fynexo:\/\//i.test(raw)) return raw;
            if (/^(settings|preferences|about:settings)$/i.test(raw)) return 'fynexo://settings';
            if (raw.startsWith('!')) {
                const sp = raw.indexOf(' ');
                const tok = (sp === -1 ? raw : raw.slice(0, sp)).toLowerCase();
                const rest = sp === -1 ? '' : raw.slice(sp + 1).trim();
                const bangs = getBangs();
                for (let i = 0; i < bangs.length; i++) {
                    const b = bangs[i];
                    if (!b || !b.trigger) continue;
                    const trig = (b.trigger.startsWith('!') ? b.trigger : '!' + b.trigger).toLowerCase();
                    if (trig === tok) {
                        if (!rest) {
                            try { return new URL(fillTpl(b.url, '')).origin; } catch (_) { return fillTpl(b.url, ''); }
                        }
                        return fillTpl(b.url, encodeURIComponent(rest));
                    }
                }
            }
            if (/^https?:\/\//i.test(raw)) return raw;
            if (/^(localhost|127\.0\.0\.1)(:\d+)?/i.test(raw)) return 'http://' + raw;
            if (raw.includes('.') && !raw.includes(' ')) return 'https://' + raw;
            const q = encodeURIComponent(raw);
            const engObj = currentEngineObj(engine);
            return fillTpl(engObj && engObj.url, q);
        }

        function updateClock() {
            const nt = (styles && styles.newtab) || {};
            const clockEl = document.getElementById('ntClock');
            if (nt.show_clock === false) {
                clockEl.style.display = 'none';
                return;
            }
            clockEl.style.display = 'inline';
            const d = new Date();
            let timeStr;
            if (nt.use_24h_clock === false) {
                let h = d.getHours();
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                timeStr = `${h}:${String(d.getMinutes()).padStart(2, '0')} ${ampm}`;
            } else {
                timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }
            const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', weekday: 'short' });
            clockEl.textContent = `${timeStr} · ${dateStr}`;
        }

        function applySurface() {
            const useCustom = !!(styles.colors && styles.colors.use_custom_colors);
            const src = useCustom ? styles.colors : (activeTheme || {});
            const t = {
                bg: src.bg || '#09090b',
                panel: src.panel || '#0e0e11',
                surface: src.surface || src.panel || '#141418',
                elevated: src.elevated || '#1c1c22',
                border: src.border || '#222228',
                borderHover: src.border_hover || src.borderHover || '#34343e',
                fg: src.fg || '#f4f4f6',
                secondary: src.secondary || '#a1a1aa',
                muted: src.muted || '#71717a',
                accent: src.accent || '#6366f1',
                accentBg: src.accent_bg || src.accentBg || '#1b1d36',
                hover: src.hover || '#18181e'
            };

            const root = document.documentElement;
            root.style.setProperty('--fnx-bg', t.bg);
            root.style.setProperty('--fnx-panel', t.panel);
            root.style.setProperty('--fnx-surface', t.surface);
            root.style.setProperty('--fnx-elevated', t.elevated);
            root.style.setProperty('--fnx-border', t.border);
            root.style.setProperty('--fnx-border-hover', t.borderHover);
            root.style.setProperty('--fnx-fg', t.fg);
            root.style.setProperty('--fnx-secondary', t.secondary);
            root.style.setProperty('--fnx-muted', t.muted);
            root.style.setProperty('--fnx-accent', t.accent);
            root.style.setProperty('--fnx-accent-bg', t.accentBg);
            root.style.setProperty('--fnx-hover', t.hover);

            const nt = (styles && styles.newtab) || {};
            const titleEl = document.getElementById('ntTitle');
            const subEl = document.getElementById('ntSubtitle');
            titleEl.textContent = (nt.title !== undefined && nt.title !== null && String(nt.title).trim() !== '') ? nt.title : 'Fynexo';
            const subTxt = nt.subtitle !== undefined ? String(nt.subtitle) : 'Single-WebView studio browser · Zero-FX compositing';
            subEl.textContent = subTxt;
            subEl.style.display = subTxt.trim() ? 'block' : 'none';

            const scSec = document.getElementById('shortcutsSection');
            scSec.style.display = nt.show_shortcuts === false ? 'none' : 'flex';

            const grid = document.getElementById('bmGrid');
            const cols = Number(nt.shortcuts_columns) || 0;
            grid.style.gridTemplateColumns = (cols >= 2 && cols <= 6) ? `repeat(${cols}, minmax(0, 1fr))` : '';

            const customCssEl = document.getElementById('__fynexo_newtab_custom_css__');
            if (customCssEl) customCssEl.textContent = nt.custom_css || '';

            const engName = currentEngineObj().name || 'Google';
            document.getElementById('ntEngineBtn').textContent = engName;
            document.getElementById('ntSearchInput').placeholder = `Search ${engName}, type !gh / !yt, or enter URL...`;

            const adOn = config.adblock !== false;
            document.getElementById('ntShieldDot').classList.toggle('off', !adOn);
            document.getElementById('ntShieldText').textContent = adOn
                ? (blockedAds > 0 ? `Adblock · ${blockedAds} blocked` : 'Adblock active')
                : 'Adblock paused';

            const incogBtn = document.getElementById('btnIncogPill');
            const incogTxt = document.getElementById('ntIncogText');
            incogBtn.classList.toggle('active', !!config.incognito);
            incogTxt.textContent = config.incognito ? 'Private: Active' : 'Private: Off';

            updateClock();
        }

        function renderBookmarks() {
            const grid = document.getElementById('bmGrid');
            grid.textContent = '';
            const frag = document.createDocumentFragment();

            bookmarks.forEach(bm => {
                const card = document.createElement('div');
                card.className = 'bm-card';
                card.onclick = () => sendIpc({ type: 'NAVIGATE', url: bm.url });

                const mono = document.createElement('div');
                mono.className = 'bm-mono';
                mono.textContent = monogramOf(bm.url, bm.title);

                const meta = document.createElement('div');
                meta.className = 'bm-meta';
                const t = document.createElement('div');
                t.className = 'bm-title';
                t.textContent = bm.title || formatHost(bm.url);
                const h = document.createElement('div');
                h.className = 'bm-host';
                h.textContent = formatHost(bm.url);
                meta.appendChild(t);
                meta.appendChild(h);

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'bm-del';
                del.title = 'Remove shortcut';
                del.textContent = '×';
                del.onclick = (e) => {
                    e.stopPropagation();
                    sendIpc({ type: 'REMOVE_BOOKMARK', url: bm.url });
                };

                card.appendChild(mono);
                card.appendChild(meta);
                card.appendChild(del);
                frag.appendChild(card);
            });

            grid.appendChild(frag);
        }

        function renderHistory() {
            const nt = (styles && styles.newtab) || {};
            const sec = document.getElementById('histSection');
            const list = document.getElementById('histList');
            list.textContent = '';

            if (nt.show_history === false) {
                sec.style.display = 'none';
                return;
            }

            const topItems = historyItems.slice(0, 8);
            if (topItems.length === 0) {
                sec.style.display = 'none';
                return;
            }

            sec.style.display = 'flex';
            const frag = document.createDocumentFragment();
            topItems.forEach(item => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'hist-row';
                row.onclick = () => sendIpc({ type: 'NAVIGATE', url: item.url });

                const mono = document.createElement('span');
                mono.className = 'hist-mono';
                mono.textContent = monogramOf(item.url, item.title);

                const title = document.createElement('span');
                title.className = 'hist-title';
                title.textContent = item.title || formatHost(item.url);

                const host = document.createElement('span');
                host.className = 'hist-host';
                host.textContent = formatHost(item.url);

                const time = document.createElement('span');
                time.className = 'hist-time';
                time.textContent = relativeTime(item.visited_at);

                row.appendChild(mono);
                row.appendChild(title);
                row.appendChild(host);
                row.appendChild(time);
                frag.appendChild(row);
            });
            list.appendChild(frag);
        }

        const searchInput = document.getElementById('ntSearchInput');
        const clearBtn = document.getElementById('ntClearBtn');
        const suggestEl = document.getElementById('ntSuggestList');
        let ntSuggestItems = [];
        let ntSuggestIdx = -1;

        function renderSuggestions() {
            const rawTrim = searchInput.value.trim();
            const q = rawTrim.toLowerCase();
            clearBtn.style.display = searchInput.value.length > 0 ? 'flex' : 'none';
            suggestEl.textContent = '';

            if (!q) {
                ntSuggestItems = [];
                ntSuggestIdx = -1;
                suggestEl.style.display = 'none';
                return;
            }

            const matches = [];
            const seen = Object.create(null);

            if (q.startsWith('!')) {
                const tok = q.split(' ')[0];
                getBangs().forEach(b => {
                    if (!b || !b.trigger) return;
                    const trig = (b.trigger.startsWith('!') ? b.trigger : '!' + b.trigger).toLowerCase();
                    if (trig.startsWith(tok) || (b.name || '').toLowerCase().includes(tok.slice(1))) {
                        matches.push({ kind: 'bang', trigger: trig, title: `${trig} — ${b.name || trig}`, url: b.url || '', tag: '!Bang' });
                    }
                });
            }

            bookmarks.forEach(b => {
                const key = (b.url || '').toLowerCase();
                if (!seen[key] && ((b.title || '').toLowerCase().includes(q) || key.includes(q))) {
                    seen[key] = true;
                    matches.push({ kind: 'url', title: b.title || formatHost(b.url), url: b.url, tag: 'Saved' });
                }
            });

            historyItems.forEach(h => {
                const key = (h.url || '').toLowerCase();
                if (!seen[key] && ((h.title || '').toLowerCase().includes(q) || key.includes(q))) {
                    seen[key] = true;
                    matches.push({ kind: 'url', title: h.title || formatHost(h.url), url: h.url, tag: 'History' });
                }
            });

            ntSuggestItems = matches.slice(0, 6);
            ntSuggestIdx = -1;

            if (ntSuggestItems.length === 0) {
                suggestEl.style.display = 'none';
                return;
            }

            suggestEl.style.display = 'flex';
            const frag = document.createDocumentFragment();
            ntSuggestItems.forEach((it, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'nt-suggest-item';
                btn.dataset.idx = String(idx);
                btn.onclick = () => {
                    if (it.kind === 'bang' && !searchInput.value.trim().includes(' ')) {
                        searchInput.value = it.trigger + ' ';
                        searchInput.focus();
                        renderSuggestions();
                        return;
                    }
                    const target = it.kind === 'bang' ? resolveQuery(searchInput.value, config.search_engine) : it.url;
                    sendIpc({ type: 'NAVIGATE', url: target });
                };

                const mono = document.createElement('span');
                mono.className = 'nt-suggest-mono';
                mono.textContent = it.kind === 'bang' ? '!' : monogramOf(it.url, it.title);

                const meta = document.createElement('span');
                meta.className = 'nt-suggest-meta';
                const t = document.createElement('span');
                t.className = 'nt-suggest-title';
                t.textContent = it.title;
                const u = document.createElement('span');
                u.className = 'nt-suggest-url';
                u.textContent = it.kind === 'bang' ? it.url : formatHost(it.url);
                meta.appendChild(t);
                meta.appendChild(u);

                const tag = document.createElement('span');
                tag.className = 'nt-suggest-tag';
                tag.textContent = it.tag;

                btn.appendChild(mono);
                btn.appendChild(meta);
                btn.appendChild(tag);
                frag.appendChild(btn);
            });
            suggestEl.appendChild(frag);
        }

        function syncSuggestSelection() {
            suggestEl.querySelectorAll('.nt-suggest-item').forEach((el, i) => {
                el.classList.toggle('selected', i === ntSuggestIdx);
            });
        }

        function submitHeroSearch() {
            if (ntSuggestIdx >= 0 && ntSuggestItems[ntSuggestIdx]) {
                const it = ntSuggestItems[ntSuggestIdx];
                if (it.kind === 'bang' && !searchInput.value.trim().includes(' ')) {
                    searchInput.value = it.trigger + ' ';
                    renderSuggestions();
                    return;
                }
                const target = it.kind === 'bang' ? resolveQuery(searchInput.value, config.search_engine) : it.url;
                sendIpc({ type: 'NAVIGATE', url: target });
                return;
            }
            const target = resolveQuery(searchInput.value, config.search_engine);
            if (target) {
                sendIpc({ type: 'NAVIGATE', url: target });
            }
        }

        searchInput.addEventListener('input', renderSuggestions);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' && ntSuggestItems.length > 0) {
                e.preventDefault();
                ntSuggestIdx = (ntSuggestIdx + 1) % ntSuggestItems.length;
                syncSuggestSelection();
                return;
            }
            if (e.key === 'ArrowUp' && ntSuggestItems.length > 0) {
                e.preventDefault();
                ntSuggestIdx = (ntSuggestIdx - 1 + ntSuggestItems.length) % ntSuggestItems.length;
                syncSuggestSelection();
                return;
            }
            if (e.key === 'Escape') {
                suggestEl.style.display = 'none';
                ntSuggestIdx = -1;
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                submitHeroSearch();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest || !e.target.closest('.nt-search-wrap')) {
                suggestEl.style.display = 'none';
            }
        });

        clearBtn.onclick = () => {
            searchInput.value = '';
            renderSuggestions();
            searchInput.focus();
        };

        document.getElementById('ntGoBtn').onclick = submitHeroSearch;

        document.getElementById('ntEngineBtn').onclick = () => {
            const list = getEngines();
            const curIdx = list.findIndex(e => e.id === config.search_engine);
            const next = list[(curIdx + 1) % list.length];
            if (next) {
                config.search_engine = next.id;
                applySurface();
                sendIpc({ type: 'SAVE_CONFIG', config: config });
            }
            searchInput.focus();
        };

        document.getElementById('btnIncogPill').onclick = () => {
            config.incognito = !config.incognito;
            applySurface();
            sendIpc({ type: 'SAVE_CONFIG', config: config });
        };

        document.getElementById('btnOpenPrefs').onclick = () => {
            sendIpc({ type: 'NAVIGATE', url: 'fynexo://settings' });
        };
        document.getElementById('btnShieldPill').onclick = () => {
            sendIpc({ type: 'NAVIGATE', url: 'fynexo://settings' });
        };

        const addBar = document.getElementById('addBmBar');
        const addTitle = document.getElementById('addBmTitle');
        const addUrl = document.getElementById('addBmUrl');
        document.getElementById('btnToggleAddBm').onclick = () => {
            const open = addBar.classList.toggle('open');
            if (open) addUrl.focus();
        };

        function submitNewBookmark() {
            const rawUrl = addUrl.value.trim();
            if (!rawUrl) return;
            sendIpc({
                type: 'ADD_BOOKMARK',
                title: addTitle.value.trim(),
                url: rawUrl
            });
            addTitle.value = '';
            addUrl.value = '';
            addBar.classList.remove('open');
        }

        document.getElementById('btnSaveBm').onclick = submitNewBookmark;
        addUrl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitNewBookmark();
            }
        });

        document.getElementById('btnClearHist').onclick = () => {
            sendIpc({ type: 'CLEAR_HISTORY' });
        };

        setInterval(updateClock, 15000);

        window.__fynexo_on_settings_runtime__ = function(payload) {
            if (!payload) return;
            if (payload.config) config = Object.assign(config, payload.config);
            if (payload.styles) styles = payload.styles;
            if (payload.active_theme) activeTheme = payload.active_theme;
            if (Array.isArray(payload.bookmarks)) bookmarks = payload.bookmarks;
            if (Array.isArray(payload.history)) historyItems = payload.history;
            if (typeof payload.blocked_ads === 'number') blockedAds = payload.blocked_ads;
            applySurface();
            renderBookmarks();
            renderHistory();
        };

        applySurface();
        renderBookmarks();
        renderHistory();
        if (window.innerWidth > 768) {
            requestAnimationFrame(() => searchInput.focus());
        }
    </script>
</body>
</html>
