<!DOCTYPE html>
<html lang="zh-CN" data-fynexo-internal="newtab">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>New Tab</title>
    <style>
        :root {
            --nt-bg: #0B0B0E;
            --nt-surface: #141418;
            --nt-elevated: #1B1B21;
            --nt-hover: #18181D;
            --nt-hairline: rgba(255, 255, 255, 0.06);
            --nt-hairline-hover: rgba(255, 255, 255, 0.12);
            --nt-top-highlight: rgba(255, 255, 255, 0.15);
            --nt-fg: #F4F4F5;
            --nt-dim: #71717A;
            --nt-faint: #52525B;
            --nt-accent: #7A88F7;
            --nt-accent-soft: rgba(122, 136, 247, 0.14);
        }

        html[data-theme-kind="light"] {
            --nt-top-highlight: rgba(255, 255, 255, 0.9);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            box-shadow: none !important;
            text-shadow: none !important;
            backdrop-filter: none !important;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--nt-bg);
            color: var(--nt-fg);
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.45;
            overflow-x: hidden;
        }

        button, input, a {
            font-family: inherit;
            touch-action: manipulation;
        }

        #__fynexo_newtab_app__ {
            width: 100%;
            min-height: 100vh;
            padding-top: calc(var(--fnx-host-top-offset, 0px) + 18px);
            padding-bottom: 56px;
            padding-left: 24px;
            padding-right: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nt-shell {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Whisper-quiet top status strip (borderless at rest) */
        .nt-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 26px;
        }

        .nt-brand-quiet {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--nt-faint);
            user-select: none;
        }

        .nt-status-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .nt-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 25px;
            padding: 0 9px;
            border-radius: 7px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--nt-dim);
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: -0.005em;
            cursor: pointer;
            transition: background 0.14s ease, color 0.14s ease;
        }
        .nt-pill:hover {
            background: var(--nt-surface);
            color: var(--nt-fg);
        }
        .nt-pill.active {
            background: var(--nt-accent-soft);
            color: var(--nt-fg);
        }

        .nt-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #10B981;
            flex-shrink: 0;
        }
        .nt-dot.off {
            background: var(--nt-faint);
        }

        /* Bonjourr / Tabliss calm clock & breathing space */
        .nt-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            margin-top: clamp(20px, 5.5vh, 56px);
        }

        .nt-clock-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            user-select: none;
        }

        .nt-clock {
            font-size: clamp(46px, 6.2vw, 62px);
            font-weight: 700;
            letter-spacing: -0.045em;
            line-height: 1;
            color: var(--nt-fg);
            font-variant-numeric: tabular-nums;
        }

        .nt-date-sub {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--nt-dim);
            letter-spacing: -0.01em;
        }

        .nt-custom-banner {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-align: center;
            user-select: none;
        }
        .nt-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--nt-fg);
        }
        .nt-subtitle {
            font-size: 12px;
            color: var(--nt-dim);
        }

        /* Raycast launcher search input with 1px top highlight reflection */
        .nt-search-wrap {
            width: 100%;
            position: relative;
        }

        .nt-search-box {
            width: 100%;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 9px 7px 11px;
            background: var(--nt-surface);
            border: 1px solid var(--nt-hairline);
            border-top-color: var(--nt-top-highlight);
            border-radius: 12px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .nt-search-box:hover {
            border-color: var(--nt-hairline-hover);
            border-top-color: var(--nt-top-highlight);
        }
        .nt-search-box:focus-within {
            background: var(--nt-elevated);
            border-color: color-mix(in srgb, var(--nt-accent) 55%, var(--nt-hairline));
            border-top-color: color-mix(in srgb, var(--nt-accent) 72%, var(--nt-top-highlight));
        }

        .nt-engine-btn {
            height: 30px;
            padding: 0 7px;
            border-radius: 7px;
            border: 1px solid var(--nt-hairline);
            background: color-mix(in srgb, var(--nt-fg) 4%, transparent);
            color: var(--nt-dim);
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
        }
        .nt-engine-btn:hover {
            border-color: var(--nt-hairline-hover);
            background: color-mix(in srgb, var(--nt-fg) 8%, transparent);
            color: var(--nt-fg);
        }
        .nt-engine-btn .nt-emblem {
            width: 14px;
            height: 14px;
        }
        .nt-engine-btn .nt-emblem-fallback,
        .nt-engine-btn .nt-emblem-img {
            width: 14px;
            height: 14px;
        }
        .nt-engine-chevron {
            opacity: 0.7;
            flex-shrink: 0;
            transition: transform 0.12s ease;
        }
        .nt-engine-btn[aria-expanded="true"] {
            border-color: var(--nt-hairline-hover);
            background: color-mix(in srgb, var(--nt-fg) 8%, transparent);
            color: var(--nt-fg);
        }
        .nt-engine-btn[aria-expanded="true"] .nt-engine-chevron {
            transform: rotate(180deg);
        }

        .nt-engine-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 196px;
            background: var(--nt-surface);
            border: 1px solid var(--nt-hairline-hover);
            border-top-color: var(--nt-top-highlight);
            border-radius: 10px;
            padding: 4px;
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 65;
        }
        .nt-engine-menu.open {
            display: flex;
        }
        .nt-engine-opt {
            width: 100%;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--nt-fg);
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            outline: none;
            transition: background 0.1s ease;
        }
        .nt-engine-opt:hover {
            background: var(--nt-elevated);
        }
        .nt-engine-opt.active {
            background: color-mix(in srgb, var(--nt-fg) 6%, transparent);
        }
        .nt-engine-opt .nt-emblem,
        .nt-engine-opt .nt-emblem-fallback,
        .nt-engine-opt .nt-emblem-img {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }
        .nt-engine-opt-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nt-engine-check {
            opacity: 0;
            color: var(--nt-fg);
            flex-shrink: 0;
        }
        .nt-engine-opt.active .nt-engine-check {
            opacity: 0.9;
        }

        .nt-search-input {
            flex: 1;
            min-width: 0;
            height: 32px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--nt-fg);
            font-size: 14.5px;
            font-weight: 400;
            letter-spacing: -0.012em;
        }
        .nt-search-input::placeholder {
            color: var(--nt-faint);
        }

        .nt-clear-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--nt-dim);
            border-radius: 6px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .nt-clear-btn:hover {
            color: var(--nt-fg);
            background: rgba(255, 255, 255, 0.06);
        }

        .nt-kbd-hint {
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--nt-faint);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid var(--nt-hairline);
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            flex-shrink: 0;
        }

        .nt-go-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--nt-hairline);
            border-radius: 7px;
            background: color-mix(in srgb, var(--nt-fg) 6%, transparent);
            color: var(--nt-dim);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }
        .nt-go-btn:hover {
            background: var(--nt-accent);
            border-color: var(--nt-accent);
            color: #ffffff;
        }

        .nt-search-box:focus-within .nt-kbd-hint,
        .nt-search-box.has-value .nt-kbd-hint {
            display: none;
        }
        .nt-search-box:focus-within .nt-go-btn,
        .nt-search-box.has-value .nt-go-btn {
            display: flex;
        }

        /* Command palette dropdown */
        .nt-suggest {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--nt-surface);
            border: 1px solid var(--nt-hairline-hover);
            border-top-color: var(--nt-top-highlight);
            border-radius: 11px;
            padding: 5px;
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 60;
        }

        .nt-suggest-item {
            width: 100%;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--nt-fg);
            padding: 7px 9px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            cursor: pointer;
            outline: none;
            transition: background 0.1s ease;
        }
        .nt-suggest-item:hover,
        .nt-suggest-item.selected {
            background: var(--nt-elevated);
        }

        .nt-suggest-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .nt-suggest-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--nt-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .nt-suggest-url {
            font-size: 11.5px;
            color: var(--nt-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 180px;
        }

        .nt-suggest-tag {
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: 10px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--nt-hairline);
            color: var(--nt-dim);
            flex-shrink: 0;
        }

        /* Section headers */
        .nt-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .nt-sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0;
        }

        .nt-sec-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--nt-faint);
        }

        .nt-mini-btn {
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--nt-faint);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
        }
        .nt-mini-btn:hover {
            border-color: var(--nt-hairline);
            background: var(--nt-surface);
            color: var(--nt-fg);
        }

        .nt-add-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: var(--nt-surface);
            border: 1px solid var(--nt-hairline);
            border-top-color: var(--nt-top-highlight);
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .nt-add-bar.open {
            display: flex;
        }

        .nt-field {
            flex: 1;
            min-width: 150px;
            height: 30px;
            padding: 0 10px;
            background: var(--nt-bg);
            border: 1px solid var(--nt-hairline);
            border-radius: 7px;
            color: var(--nt-fg);
            font-size: 12px;
            outline: none;
        }
        .nt-field:focus {
            border-color: color-mix(in srgb, var(--nt-accent) 55%, transparent);
        }

        .nt-save-btn {
            height: 30px;
            padding: 0 12px;
            border-radius: 7px;
            border: 1px solid var(--nt-accent);
            background: var(--nt-accent);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Vercel Dashboard single-row 6-column compact shortcut capsules */
        .bm-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
        }

        .bm-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 10px;
            background: var(--nt-surface);
            border: 1px solid var(--nt-hairline);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            min-width: 0;
            transition: border-color 0.12s ease, background 0.12s ease;
        }
        .bm-card:hover {
            border-color: var(--nt-hairline-hover);
            background: var(--nt-elevated);
        }

        .bm-card--empty {
            grid-column: span 2;
            border-style: dashed;
            background: transparent;
            color: var(--nt-dim);
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
        }
        .bm-card--empty:hover {
            color: var(--nt-fg);
            background: var(--nt-surface);
        }

        /* Shared site emblem (real favicon + SVG/monogram fallback) */
        .nt-emblem {
            position: relative;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .nt-emblem-fallback {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            transition: opacity 0.12s ease;
        }
        .nt-emblem-fallback--mono {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--nt-hairline);
        }

        .nt-emblem-img {
            position: absolute;
            inset: 0;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.14s ease;
        }
        .nt-emblem.has-img .nt-emblem-img {
            opacity: 1;
        }
        .nt-emblem.has-img .nt-emblem-fallback {
            opacity: 0;
        }

        .bm-title {
            flex: 1;
            min-width: 0;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--nt-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.008em;
        }
        .bm-card:hover .bm-title {
            padding-right: 18px;
        }

        .bm-del {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 5px;
            background: var(--nt-elevated);
            color: var(--nt-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
        }
        .bm-card:hover .bm-del {
            opacity: 0.92;
            pointer-events: auto;
        }
        .bm-del:hover {
            opacity: 1 !important;
            background: rgba(255, 255, 255, 0.10);
            color: var(--nt-fg);
        }

        /* Raycast Ghost List for Recent History: borderless, dividerless, hover reveal */
        .hist-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: transparent;
            border: none;
        }

        .hist-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 36px;
            margin: 0 -10px;
            padding: 0 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--nt-fg);
            text-align: left;
            cursor: pointer;
            width: calc(100% + 20px);
            transition: background 0.12s ease;
        }
        .hist-row:hover,
        .hist-row:focus-visible {
            outline: none;
            background: var(--nt-surface);
        }

        .hist-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .hist-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--nt-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            letter-spacing: -0.008em;
        }

        .hist-host {
            font-size: 12px;
            font-weight: 400;
            color: var(--nt-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 190px;
        }

        .hist-right {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .hist-time {
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: 11px;
            color: var(--nt-faint);
            font-variant-numeric: tabular-nums;
        }

        .hist-kbd {
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: 10.5px;
            font-weight: 500;
            color: var(--nt-dim);
            min-width: 36px;
            height: 20px;
            padding: 0 6px;
            border-radius: 5px;
            border: 1px solid var(--nt-hairline);
            background: color-mix(in srgb, var(--nt-fg) 4%, transparent);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transition: opacity 0.12s ease, color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
        }
        .hist-row:hover .hist-kbd,
        .hist-row:focus-visible .hist-kbd,
        html.nt-alt-held .hist-kbd {
            opacity: 1;
            border-color: var(--nt-hairline-hover);
        }

        @media (max-width: 768px) {
            #__fynexo_newtab_app__ {
                padding-top: calc(var(--fnx-host-top-offset, 0px) + 14px);
                padding-bottom: calc(var(--fnx-host-bottom-offset, 54px) + max(env(safe-area-inset-bottom, 0px), 12px) + 24px);
                padding-left: 14px;
                padding-right: 14px;
            }
            .nt-shell { gap: 22px; }
            .nt-hero { margin-top: 12px; gap: 20px; }
            .nt-clock { font-size: 42px; }
            .nt-pill { padding: 5px 10px; }
            .nt-engine-btn { height: 34px; padding: 0 9px; }
            .nt-engine-opt { min-height: 38px; padding: 8px 10px; }
            .nt-mini-btn { padding: 6px 10px; font-size: 12px; }
            #addBmTitle { max-width: none !important; flex: 1 1 100%; }
            .nt-field, .nt-save-btn { height: 36px; }
            .bm-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
            .bm-card { height: 42px; padding: 0 11px; }
            .bm-del { opacity: 0.72; pointer-events: auto; }
            .hist-row { min-height: 40px; padding: 8px 10px; }
            .nt-kbd-hint, .hist-kbd { display: none; }
            .hist-host { max-width: 110px; }
        }

        @media (max-width: 480px) {
            .nt-topbar { flex-wrap: wrap; gap: 8px; }
            #addBmBar .nt-save-btn { width: 100%; justify-content: center; }
            .bm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .hist-host { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }

    <script>

        function getEngines() {

        function sendIpc(data) {

        function safeParsedUrl(rawUrl) {

                const u = new URL(rawUrl);

            } catch (_) {}

        function formatHost(u) {

        function monogramOf(url, title) {
            try {
                const h = new URL(url).hostname.replace(/^(www|m)\./, '');
                if (h) return h.charAt(0).toUpperCase();
            } catch (_) {}
            const t = (title || '').trim();
            return t ? t.charAt(0).toUpperCase() : '•';

        function monogramColor(url) {
            const palette = ['#7A88F7', '#38BDF8', '#34D399', '#F472B6', '#FB923C', '#A78BFA'];
            const s = String(url || '');
            let h = 0;
            for (let i = 0; i < s.length; i++) {

            return palette[Math.abs(h) % palette.length];

                svg.appendChild(createSvgEl('path', { d: 'M4.38 9.27A3.9 3.9 0 0 1 4.18 8c0-.44.08-.87.2-1.27V5.06H2.23A6.49 6.49 0 0 0 1.5 8c0 1.05.25 2.04.73 2.94l2.15-1.67Z', fill: '#FBBC05' }));
                svg.appendChild(createSvgEl('path', { d: 'M8 4.06c.95 0 1.8.33 2.47.97l1.85-1.85C11.19 2.13 9.74 1.5 8 1.5a6.49 6.49 0 0 0-5.77 3.56l2.15 1.67C4.89 5.2 6.32 4.06 8 4.06Z', fill: '#EA4335' }));

        function createSiteEmblem(rawUrl, title) {
            const wrap = document.createElement('span');
            wrap.className = 'nt-emblem';

            const parsed = safeParsedUrl(rawUrl);
            const host = parsed ? parsed.hostname.replace(/^www\./, '') : '';
            const brandSvg = createBrandSvg(host, rawUrl);

            const fb = document.createElement('span');
            fb.className = 'nt-emblem-fallback' + (brandSvg ? '' : ' nt-emblem-fallback--mono');
            if (brandSvg) {
                fb.appendChild(brandSvg);
            } else {
                fb.textContent = monogramOf(rawUrl, title);
                fb.style.color = monogramColor(rawUrl);
            }
            wrap.appendChild(fb);

            if (!brandSvg && parsed && (parsed.protocol === 'http:' || parsed.protocol === 'https:') && parsed.hostname) {
                const img = document.createElement('img');
                img.className = 'nt-emblem-img';
                img.alt = '';
                img.loading = 'lazy';
                img.decoding = 'async';
                img.referrerPolicy = 'no-referrer';
                img.onload = () => {
                    if (img.naturalWidth > 1) {
                        wrap.classList.add('has-img');
                    }
                };
                img.onerror = () => {
                    img.remove();
                };
                img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(parsed.hostname)}&sz=32`;
                wrap.appendChild(img);
            }
            return wrap;
        }

        function relativeTime(ts) {
            if (!ts) return '';
            const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(ts));
            if (diff < 60) return 'now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h';
            return Math.floor(diff / 86400) + 'd';
        }

        function fillTpl(tpl, q) {
            const s = String(tpl || 'https://www.google.com/search?q={query}');
            if (s.includes('{query}')) return s.split('{query}').join(q);
            if (s.includes('%s')) return s.split('%s').join(q);
            return s + q;
        }

        function resolveQuery(raw, engine) {
            raw = (raw || '').trim();
            if (!raw) return '';
            if (/^fynexo:\/\//i.test(raw)) return raw;
            if (/^(settings|preferences|about:settings)$/i.test(raw)) return 'fynexo://settings';
            if (raw.startsWith('!')) {
                const sp = raw.indexOf(' ');
                const tok = (sp === -1 ? raw : raw.slice(0, sp)).toLowerCase();
                const rest = sp === -1 ? '' : raw.slice(sp + 1).trim();
                const bangs = getBangs();
                for (let i = 0; i < bangs.length; i++) {
                    const b = bangs[i];
                    if (!b || !b.trigger) continue;
                    const trig = (b.trigger.startsWith('!') ? b.trigger : '!' + b.trigger).toLowerCase();
                    if (trig === tok) {
                        if (!rest) {
                            try { return new URL(fillTpl(b.url, '')).origin; } catch (_) { return fillTpl(b.url, ''); }
                        }
                        return fillTpl(b.url, encodeURIComponent(rest));
                    }
                }
            }
            if (/^https?:\/\//i.test(raw)) return raw;
            if (/^(localhost|127\.0\.0\.1)(:\d+)?/i.test(raw)) return 'http://' + raw;
            if (raw.includes('.') && !raw.includes(' ')) return 'https://' + raw;
            const q = encodeURIComponent(raw);
            const engObj = currentEngineObj(engine);
            return fillTpl(engObj && engObj.url, q);
        }

        function isLightHex(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
            if (!m) return false;
            const n = parseInt(m[1], 16);
            const r = (n >> 16) & 255;
            const g = (n >> 8) & 255;
            const b = n & 255;
            return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 140;
        }

        function updateClock() {
            const nt = (styles && styles.newtab) || {};
            const clockWrap = document.getElementById('ntClockWrap');
            const clockEl = document.getElementById('ntClock');
            const dateSub = document.getElementById('ntDateSub');
            const d = new Date();
            const longDate = d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

            if (nt.show_clock === false) {
                clockWrap.style.display = 'none';
                return;
            }
            clockWrap.style.display = 'flex';

            let timeStr;
            if (nt.use_24h_clock === false) {
                let h = d.getHours();

            }

            dateSub.textContent = longDate;

        function applySurface() {
            const useCustom = !!(styles.colors && styles.colors.use_custom_colors);
            const src = useCustom ? styles.colors : (activeTheme || {});

            if (customCssEl) customCssEl.textContent = nt.custom_css || '';

            const engObj = currentEngineObj();
            const engName = (engObj && engObj.name) || 'Google';
            const engBtn = document.getElementById('ntEngineBtn');
            if (engBtn) {

                chev.appendChild(createSvgEl('path', { d: 'M4.5 6.5L8 10l3.5-3.5', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
                engBtn.appendChild(chev);
                engBtn.title = `Search engine: ${engName} (click to choose)`;
                engBtn.setAttribute('aria-label', `Search engine: ${engName}`);
                if (typeof engineMenuEl !== 'undefined' && engineMenuEl && engineMenuEl.classList.contains('open')) {
                    renderEngineMenu();
                }
            }
            document.getElementById('ntSearchInput').placeholder = `Search ${engName}, !gh, or enter URL...`;

            const adOn = config.adblock !== false;
            document.getElementById('ntShieldDot').classList.toggle('off', !adOn);
            document.getElementById('ntShieldText').textContent = adOn
                ? (blockedAds > 0 ? `Adblock · ${blockedAds}` : 'Adblock active')
                : 'Adblock paused';

            const incogBtn = document.getElementById('btnIncogPill');
            const incogTxt = document.getElementById('ntIncogText');
            incogBtn.classList.toggle('active', !!config.incognito);
            incogTxt.textContent = config.incognito ? 'Private: Active' : 'Private: Off';

            updateClock();
        }

        function renderBookmarks() {
            const grid = document.getElementById('bmGrid');
            grid.textContent = '';
            const frag = document.createDocumentFragment();

            if (bookmarks.length === 0) {
                const emptyBtn = document.createElement('button');
                emptyBtn.type = 'button';
                emptyBtn.className = 'bm-card bm-card--empty';
                emptyBtn.textContent = '+ Add a shortcut';
                emptyBtn.onclick = () => {
                    document.getElementById('addBmBar').classList.add('open');
                    document.getElementById('addBmUrl').focus();
                };
                frag.appendChild(emptyBtn);
                grid.appendChild(frag);
                return;
            }

            bookmarks.forEach(bm => {
                const card = document.createElement('div');
                card.className = 'bm-card';
                card.title = bm.url || '';
                card.setAttribute('role', 'button');
                card.tabIndex = 0;
                card.onclick = () => sendIpc({ type: 'NAVIGATE', url: bm.url });
                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        sendIpc({ type: 'NAVIGATE', url: bm.url });
                    }
                };

                card.appendChild(createSiteEmblem(bm.url, bm.title));

                const t = document.createElement('span');
                t.className = 'bm-title';
                t.textContent = bm.title || formatHost(bm.url);
                card.appendChild(t);

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'bm-del';
                del.title = 'Remove shortcut';
                del.setAttribute('aria-label', 'Remove shortcut');
                del.textContent = '×';
                del.onclick = (e) => {
                    e.stopPropagation();
                    sendIpc({ type: 'REMOVE_BOOKMARK', url: bm.url });
                };
                card.appendChild(del);

                frag.appendChild(card);
            });

            grid.appendChild(frag);
        }

        function canonicalHistoryUrl(rawUrl) {
            const s = String(rawUrl || '').trim();
            if (!s) return '';
            try {
                const u = new URL(s);
                const host = u.hostname.toLowerCase().replace(/^www\./, '');
                const path = (u.pathname === '/' ? '' : u.pathname.replace(/\/+$/, ''));
                const dropKeys = new Set(['t', 'pp', 'si', 'feature', 'fbclid', 'gclid']);
                const params = new URLSearchParams();
                for (const [k, v] of u.searchParams.entries()) {
                    const lk = k.toLowerCase();
                    if (!dropKeys.has(lk) && !lk.startsWith('utm_')) {
                        params.append(k, v);
                    }
                }
                const qs = params.toString();
                return `${u.protocol.toLowerCase()}//${host}${u.port ? ':' + u.port : ''}${path}${qs ? '?' + qs : ''}`;
            } catch (_) {
                return s.toLowerCase().replace(/\/+$/, '');
            }
        }

        function cleanHistoryTitle(rawTitle, rawUrl) {
            const stripped = String(rawTitle || '').trim().replace(/^\(\d+\+?\)\s*/, '').trim();
            return stripped || formatHost(rawUrl);
        }

        function dedupeHistoryItems(items) {
            const seenUrls = new Set();
            const seenTitles = new Set();
            const out = [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (!item || !item.url) continue;
                const urlKey = canonicalHistoryUrl(item.url);
                if (!urlKey || seenUrls.has(urlKey)) continue;
                const cleanTitle = cleanHistoryTitle(item.title, item.url);
                const titleKey = cleanTitle ? `${formatHost(item.url).toLowerCase()}\0${cleanTitle}` : '';
                if (titleKey && seenTitles.has(titleKey)) continue;
                seenUrls.add(urlKey);
                if (titleKey) seenTitles.add(titleKey);
                out.push(item);
            }
            return out;
        }

        let recentTopItems = [];

        function renderHistory() {
            const nt = (styles && styles.newtab) || {};
            const sec = document.getElementById('histSection');
            const list = document.getElementById('histList');
            list.textContent = '';

            if (nt.show_history === false) {
                recentTopItems = [];
                sec.style.display = 'none';
                return;
            }

            recentTopItems = dedupeHistoryItems(historyItems).slice(0, 8);
            if (recentTopItems.length === 0) {
                sec.style.display = 'none';
                return;
            }

            sec.style.display = 'flex';
            const frag = document.createDocumentFragment();
            recentTopItems.forEach((item, idx) => {
                const displayTitle = cleanHistoryTitle(item.title, item.url);
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'hist-row';
                row.title = `Open ${item.url || ''} (Alt+${idx + 1})`;
                row.onclick = () => sendIpc({ type: 'NAVIGATE', url: item.url });

                const left = document.createElement('span');
                left.className = 'hist-left';
                left.appendChild(createSiteEmblem(item.url, displayTitle));

                const title = document.createElement('span');
                title.className = 'hist-title';
                title.textContent = displayTitle;

                const host = document.createElement('span');
                host.className = 'hist-host';
                host.textContent = formatHost(item.url);

                left.appendChild(title);
                left.appendChild(host);

                const right = document.createElement('span');
                right.className = 'hist-right';

                const time = document.createElement('span');
                time.className = 'hist-time';
                time.textContent = relativeTime(item.visited_at);

                const kbd = document.createElement('span');
                kbd.className = 'hist-kbd';
                kbd.textContent = `Alt+${idx + 1}`;

                right.appendChild(time);
                right.appendChild(kbd);

                row.appendChild(left);
                row.appendChild(right);
                frag.appendChild(row);
            });
            list.appendChild(frag);
        }

        const searchBox = document.getElementById('ntSearchBox');
        const searchInput = document.getElementById('ntSearchInput');
        const clearBtn = document.getElementById('ntClearBtn');
        const suggestEl = document.getElementById('ntSuggestList');
        let ntSuggestItems = [];
        let ntSuggestIdx = -1;

        function renderSuggestions() {
            const rawTrim = searchInput.value.trim();
            const q = rawTrim.toLowerCase();
            const hasVal = searchInput.value.length > 0;
            clearBtn.style.display = hasVal ? 'flex' : 'none';
            if (searchBox) searchBox.classList.toggle('has-value', hasVal);
            suggestEl.textContent = '';

            if (!q) {
                ntSuggestItems = [];
                ntSuggestIdx = -1;
                suggestEl.style.display = 'none';
                return;
            }

            const matches = [];
            const seen = Object.create(null);

            if (q.startsWith('!')) {
                const tok = q.split(' ')[0];
                getBangs().forEach(b => {
                    if (!b || !b.trigger) return;
                    const trig = (b.trigger.startsWith('!') ? b.trigger : '!' + b.trigger).toLowerCase();
                    if (trig.startsWith(tok) || (b.name || '').toLowerCase().includes(tok.slice(1))) {
                        matches.push({ kind: 'bang', trigger: trig, title: `${trig} — ${b.name || trig}`, url: b.url || '', tag: '!Bang' });
                    }
                });
            }

            bookmarks.forEach(b => {
                const key = (b.url || '').toLowerCase();
                if (!seen[key] && ((b.title || '').toLowerCase().includes(q) || key.includes(q))) {
                    seen[key] = true;
                    matches.push({ kind: 'url', title: b.title || formatHost(b.url), url: b.url, tag: 'Shortcut' });
                }
            });

            dedupeHistoryItems(historyItems).forEach(h => {
                const key = canonicalHistoryUrl(h.url);
                const cleanTitle = cleanHistoryTitle(h.title, h.url);
                if (!seen[key] && (cleanTitle.toLowerCase().includes(q) || key.includes(q))) {
                    seen[key] = true;
                    matches.push({ kind: 'url', title: cleanTitle, url: h.url, tag: 'Recent' });
                }
            });

            ntSuggestItems = matches.slice(0, 6);
            ntSuggestIdx = -1;

            if (ntSuggestItems.length === 0) {
                suggestEl.style.display = 'none';
                return;
            }

            suggestEl.style.display = 'flex';
            const frag = document.createDocumentFragment();
            ntSuggestItems.forEach((it, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'nt-suggest-item';
                btn.dataset.idx = String(idx);
                btn.onclick = () => {
                    if (it.kind === 'bang' && !searchInput.value.trim().includes(' ')) {
                        searchInput.value = it.trigger + ' ';
                        searchInput.focus();
                        renderSuggestions();
                        return;
                    }
                    const target = it.kind === 'bang' ? resolveQuery(searchInput.value, config.search_engine) : it.url;
                    sendIpc({ type: 'NAVIGATE', url: target });
                };

                if (it.kind === 'bang') {
                    const mono = document.createElement('span');
                    mono.className = 'nt-emblem';
                    const fb = document.createElement('span');
                    fb.className = 'nt-emblem-fallback nt-emblem-fallback--mono';
                    fb.textContent = '!';
                    fb.style.color = 'var(--nt-accent)';
                    mono.appendChild(fb);
                    btn.appendChild(mono);
                } else {
                    btn.appendChild(createSiteEmblem(it.url, it.title));
                }

                const meta = document.createElement('span');
                meta.className = 'nt-suggest-meta';
                const t = document.createElement('span');
                t.className = 'nt-suggest-title';
                t.textContent = it.title;
                const u = document.createElement('span');
                u.className = 'nt-suggest-url';
                u.textContent = it.kind === 'bang' ? it.url : formatHost(it.url);
                meta.appendChild(t);
                meta.appendChild(u);

                const tag = document.createElement('span');
                tag.className = 'nt-suggest-tag';
                tag.textContent = it.tag;

                btn.appendChild(meta);
                btn.appendChild(tag);
                frag.appendChild(btn);
            });
            suggestEl.appendChild(frag);
        }

        function syncSuggestSelection() {
            suggestEl.querySelectorAll('.nt-suggest-item').forEach((el, i) => {
                el.classList.toggle('selected', i === ntSuggestIdx);
            });
        }

        function submitHeroSearch() {
            if (ntSuggestIdx >= 0 && ntSuggestItems[ntSuggestIdx]) {
                const it = ntSuggestItems[ntSuggestIdx];
                if (it.kind === 'bang' && !searchInput.value.trim().includes(' ')) {
                    searchInput.value = it.trigger + ' ';
                    renderSuggestions();
                    return;
                }
                const target = it.kind === 'bang' ? resolveQuery(searchInput.value, config.search_engine) : it.url;
                sendIpc({ type: 'NAVIGATE', url: target });
                return;
            }
            const target = resolveQuery(searchInput.value, config.search_engine);
            if (target) {
                sendIpc({ type: 'NAVIGATE', url: target });
            }
        }

        const engineBtnEl = document.getElementById('ntEngineBtn');
        const engineMenuEl = document.getElementById('ntEngineMenu');

        function closeEngineMenu() {
            if (!engineMenuEl || !engineBtnEl) return;
            engineMenuEl.classList.remove('open');
            engineBtnEl.setAttribute('aria-expanded', 'false');
        }

        function renderEngineMenu() {
            if (!engineMenuEl) return;
            engineMenuEl.textContent = '';
            const list = getEngines();
            const cur = currentEngineObj();
            for (const eng of list) {
                if (!eng || !eng.id) continue;
                const active = cur && eng.id === cur.id;
                const opt = document.createElement('button');
                opt.type = 'button';
                opt.className = 'nt-engine-opt' + (active ? ' active' : '');
                opt.setAttribute('role', 'option');
                opt.setAttribute('aria-selected', active ? 'true' : 'false');
                opt.appendChild(createSiteEmblem(eng.url, eng.name || eng.id));
                const nameSpan = document.createElement('span');
                nameSpan.className = 'nt-engine-opt-name';
                nameSpan.textContent = eng.name || eng.id;
                opt.appendChild(nameSpan);
                const chk = createSvgEl('svg', { width: 12, height: 12, viewBox: '0 0 16 16', fill: 'none', class: 'nt-engine-check' });
                chk.appendChild(createSvgEl('path', { d: 'M3.5 8.5l3 3 6-6.5', stroke: 'currentColor', 'stroke-width': 1.7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
                opt.appendChild(chk);
                opt.onclick = (ev) => {
                    ev.stopPropagation();
                    config.search_engine = eng.id;
                    closeEngineMenu();
                    applySurface();
                    sendIpc({ type: 'SAVE_CONFIG', config: config });
                    searchInput.focus();
                };
                engineMenuEl.appendChild(opt);
            }
        }

        function toggleEngineMenu() {
            if (!engineMenuEl || !engineBtnEl) return;
            const willOpen = !engineMenuEl.classList.contains('open');
            if (willOpen) {
                suggestEl.style.display = 'none';
                ntSuggestIdx = -1;
                renderEngineMenu();
                engineMenuEl.classList.add('open');
                engineBtnEl.setAttribute('aria-expanded', 'true');
            } else {
                closeEngineMenu();
            }
        }

        searchInput.addEventListener('focus', closeEngineMenu);
        searchInput.addEventListener('input', () => {
            closeEngineMenu();
            renderSuggestions();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' && ntSuggestItems.length > 0) {
                e.preventDefault();
                ntSuggestIdx = (ntSuggestIdx + 1) % ntSuggestItems.length;
                syncSuggestSelection();
                return;
            }
            if (e.key === 'ArrowUp' && ntSuggestItems.length > 0) {
                e.preventDefault();
                ntSuggestIdx = (ntSuggestIdx - 1 + ntSuggestItems.length) % ntSuggestItems.length;
                syncSuggestSelection();
                return;
            }
            if (e.key === 'Escape') {
                closeEngineMenu();
                suggestEl.style.display = 'none';
                ntSuggestIdx = -1;
                searchInput.blur();
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                submitHeroSearch();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && engineMenuEl && engineMenuEl.classList.contains('open')) {
                closeEngineMenu();
                return;
            }
            if (e.key === 'Alt' || e.altKey) {
                document.documentElement.classList.add('nt-alt-held');
            }
            const active = document.activeElement;
            const inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');

            if (e.key === '/' && !inInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
                return;
            }

            if ((e.metaKey || e.altKey) && !e.ctrlKey && !e.shiftKey) {
                const n = Number(e.key);
                if (Number.isInteger(n) && n >= 1 && n <= recentTopItems.length) {
                    const target = recentTopItems[n - 1];
                    if (target && target.url) {
                        e.preventDefault();
                        sendIpc({ type: 'NAVIGATE', url: target.url });
                    }
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Alt' || !e.altKey) {
                document.documentElement.classList.remove('nt-alt-held');
            }
        });

        window.addEventListener('blur', () => {
            document.documentElement.classList.remove('nt-alt-held');
            closeEngineMenu();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest || !e.target.closest('.nt-search-wrap')) {
                suggestEl.style.display = 'none';
                closeEngineMenu();
            } else if (!e.target.closest('#ntEngineBtn') && !e.target.closest('#ntEngineMenu')) {
                closeEngineMenu();
            }
        });

        clearBtn.onclick = () => {
            searchInput.value = '';
            renderSuggestions();
            searchInput.focus();
        };

        document.getElementById('ntGoBtn').onclick = submitHeroSearch;

        engineBtnEl.onclick = (e) => {
            e.stopPropagation();
            toggleEngineMenu();
        };

        document.getElementById('btnIncogPill').onclick = () => {
            config.incognito = !config.incognito;
            applySurface();
            sendIpc({ type: 'SAVE_CONFIG', config: config });
        };

        document.getElementById('btnShieldPill').onclick = () => {
            config.adblock = config.adblock === false;
            applySurface();
            sendIpc({ type: 'SAVE_CONFIG', config: config });
        };

        const addBar = document.getElementById('addBmBar');
        const addTitle = document.getElementById('addBmTitle');
        const addUrl = document.getElementById('addBmUrl');
        document.getElementById('btnToggleAddBm').onclick = () => {
            const open = addBar.classList.toggle('open');
            if (open) addUrl.focus();
        };

        function submitNewBookmark() {
            const rawUrl = addUrl.value.trim();
            if (!rawUrl) return;
            sendIpc({
                type: 'ADD_BOOKMARK',
                title: addTitle.value.trim(),
                url: rawUrl
            });
            addTitle.value = '';
            addUrl.value = '';
            addBar.classList.remove('open');
        }

        document.getElementById('btnSaveBm').onclick = submitNewBookmark;
        addUrl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitNewBookmark();
            }
        });

        document.getElementById('btnClearHist').onclick = () => {
            sendIpc({ type: 'CLEAR_HISTORY' });
        };

        setInterval(updateClock, 15000);

        window.__fynexo_on_settings_runtime__ = function(payload) {
            if (!payload) return;
            if (payload.config) config = Object.assign(config, payload.config);
            if (payload.styles) styles = payload.styles;
            if (payload.active_theme) activeTheme = payload.active_theme;
            if (Array.isArray(payload.bookmarks)) bookmarks = payload.bookmarks;
            if (Array.isArray(payload.history)) historyItems = payload.history;
            if (typeof payload.blocked_ads === 'number') blockedAds = payload.blocked_ads;
            applySurface();
            renderBookmarks();
            renderHistory();
        };

        applySurface();
        renderBookmarks();
        renderHistory();
        if (window.innerWidth > 768) {
            requestAnimationFrame(() => searchInput.focus());
        }
    </script>
</body>
</html>
