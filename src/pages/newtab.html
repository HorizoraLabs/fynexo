<!DOCTYPE html>
<html lang="zh-CN" data-fynexo-internal="newtab">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>New Tab</title>
    <style>
__FNX_NEWTAB_CSS__
    </style>
    <style id="__fynexo_newtab_custom_css__"></style>
</head>
<body>
    <div id="__fynexo_newtab_app__">
        <div class="nt-shell">
            <section class="nt-hero">
                <div class="nt-clock-wrap" id="ntClockWrap">
                    <div class="nt-clock" id="ntClock">--:--</div>
                    <div class="nt-date-sub" id="ntDateSub"></div>
                </div>

                <div class="nt-custom-banner" id="ntCustomBanner">
                    <h1 class="nt-title" id="ntTitle"></h1>
                    <p class="nt-subtitle" id="ntSubtitle"></p>
                </div>

                <div class="nt-search-wrap">
                    <div class="nt-search-box" id="ntSearchBox">
                        <button type="button" class="nt-engine-btn" id="ntEngineBtn" aria-haspopup="listbox" aria-expanded="false" title="Choose search engine">Google</button>
                        <input type="text" id="ntSearchInput" class="nt-search-input" autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="go" placeholder="Search Google, >cmd, math, !gh / !yt, or enter URL...">
                        <button type="button" class="nt-clear-btn" id="ntClearBtn" title="Clear">
                            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" fill="currentColor" fill-opacity="0.18"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                        </button>
                        <span class="nt-kbd-hint" id="ntSearchHint" title="Press / to focus">/</span>
                        <button type="button" class="nt-go-btn" id="ntGoBtn" title="Go (Enter)">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M12.5 4.2v3.6a1.5 1.5 0 0 1-1.5 1.5H4.2M6.8 6.7L4.2 9.3l2.6 2.6" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <div class="nt-engine-menu" id="ntEngineMenu" role="listbox" aria-label="Search engines"></div>
                        <div class="nt-suggest" id="ntSuggestList"></div>
                    </div>
                    <div class="nt-bang-bar" id="ntBangBar"></div>
                </div>
            </section>

            <section class="nt-section" id="shortcutsSection">
                <div class="nt-sec-head">
                    <span class="nt-sec-label" id="ntShortcutsLabel">Shortcuts</span>
                    <div class="nt-sec-actions">
                        <button type="button" class="nt-mini-btn" id="btnManageBm">Manage →</button>
                        <button type="button" class="nt-mini-btn" id="btnToggleAddBm">+ Add</button>
                    </div>
                </div>

                <div class="nt-add-bar" id="addBmBar">
                    <input type="text" id="addBmTitle" class="nt-field" placeholder="Name (optional)" style="max-width: 190px;">
                    <input type="text" id="addBmUrl" class="nt-field" placeholder="URL (e.g. github.com)">
                    <button type="button" class="nt-save-btn" id="btnSaveBm">Save</button>
                </div>

                <div class="bm-grid" id="bmGrid"></div>
            </section>

            <section class="nt-section" id="histSection" style="display: none;">
                <div class="nt-sec-head">
                    <span class="nt-sec-label" id="ntHistLabel">Recent</span>
                    <div class="nt-sec-actions">
                        <button type="button" class="nt-mini-btn" id="btnManageHist">All →</button>
                        <button type="button" class="nt-mini-btn" id="btnClearHist">Clear</button>
                    </div>
                </div>
                <div class="hist-list" id="histList"></div>
            </section>
        </div>

        <button type="button" class="nt-customize-fab" id="ntCustomizeBtn" title="Customize Start Page">
            <svg width="13.5" height="13.5" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="5.5" cy="4.5" r="1.5" fill="currentColor"/><circle cx="10.5" cy="8" r="1.5" fill="currentColor"/><circle cx="6.5" cy="11.5" r="1.5" fill="currentColor"/></svg>
            <span id="ntCustomizeBtnLabel">Customize</span>
        </button>

        <div class="nt-customize-panel" id="ntCustomizePanel" role="dialog" aria-label="Customize Start Page">
            <div class="nt-cust-head">
                <span class="nt-cust-title" id="ntCustTitle">Start Page Studio</span>
                <button type="button" class="nt-mini-btn" id="ntCustFullBtn">Full Studio →</button>
            </div>
            <div class="nt-cust-group">
                <span class="nt-cust-label" id="ntCustWpLabel">Wallpaper &amp; Ambience</span>
                <div class="nt-cust-chips" id="ntCustWpPresets">
                    <button type="button" class="nt-cust-chip" data-nt-wp="">Minimal</button>
                    <button type="button" class="nt-cust-chip" data-nt-wp="linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #311042 100%)">Aurora</button>
                    <button type="button" class="nt-cust-chip" data-nt-wp="linear-gradient(135deg, #082f49 0%, #0f172a 55%, #022c22 100%)">Ocean</button>
                    <button type="button" class="nt-cust-chip" data-nt-wp="linear-gradient(135deg, #2e1065 0%, #4c1d95 45%, #831843 100%)">Twilight</button>
                    <button type="button" class="nt-cust-chip" data-nt-wp="linear-gradient(135deg, #052e16 0%, #14532d 50%, #0f172a 100%)">Forest</button>
                    <button type="button" class="nt-cust-chip" data-nt-wp="linear-gradient(135deg, #431407 0%, #7c2d12 48%, #3b0764 100%)">Sunset</button>
                </div>
            </div>
            <div class="nt-cust-row">
                <span class="nt-cust-label" id="ntCustDimLabel">Dim &amp; Blur</span>
                <div class="nt-cust-sliders">
                    <input type="range" id="ntCustDimRange" min="0" max="90" step="5" value="45" title="Wallpaper dim %">
                    <input type="range" id="ntCustBlurRange" min="0" max="24" step="1" value="0" title="Wallpaper blur px">
                </div>
            </div>
            <div class="nt-cust-row">
                <span class="nt-cust-label" id="ntCustColsLabel">Grid Columns</span>
                <div class="nt-cust-chips" id="ntCustColsGroup">
                    <button type="button" class="nt-cust-chip" data-nt-cols="0">Auto</button>
                    <button type="button" class="nt-cust-chip" data-nt-cols="3">3</button>
                    <button type="button" class="nt-cust-chip" data-nt-cols="4">4</button>
                    <button type="button" class="nt-cust-chip" data-nt-cols="5">5</button>
                    <button type="button" class="nt-cust-chip" data-nt-cols="6">6</button>
                </div>
            </div>
            <div class="nt-cust-row">
                <span class="nt-cust-label" id="ntCustModsLabel">Modules</span>
                <div class="nt-cust-chips">
                    <button type="button" class="nt-cust-chip" id="ntModClock">Clock</button>
                    <button type="button" class="nt-cust-chip" id="ntMod24h">24h</button>
                    <button type="button" class="nt-cust-chip" id="ntModShortcuts">Shortcuts</button>
                    <button type="button" class="nt-cust-chip" id="ntModHistory">Recent</button>
                </div>
            </div>
        </div>
    </div>

    <script>
__FNX_NEWTAB_JS__
    </script>
</body>
</html>
