<!DOCTYPE html>
<html lang="zh-CN" data-fynexo-internal="downloads">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Downloads — Fynexo</title>
    <style>
__FNX_DOWNLOADS_CSS__
    </style>
</head>
<body>
    <div id="__fynexo_downloads_app__">
        <header class="dl-header">
            <div class="dl-header-inner">
                <div class="dl-title-group">
                    <svg class="dl-brand-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M8 2.2v7.6M5 7.2L8 10.2l3-3M2.8 12.6h10.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1 id="dlTitle">Downloads</h1>
                    <span class="dl-count-badge" id="dlCountBadge">0</span>
                </div>
                <div class="dl-search-box">
                    <svg class="dl-search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <circle cx="7.2" cy="7.2" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10.6 10.6L13.8 13.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input type="text" id="dlSearchInput" class="dl-search-input" placeholder="Search files or source domains..." autocomplete="off" spellcheck="false">
                    <button type="button" class="dl-clear-search" id="dlClearSearch" aria-label="Clear">×</button>
                </div>
                <div class="dl-head-actions">
                    <button type="button" class="dl-btn" id="btnOpenFolder">Open folder</button>
                    <button type="button" class="dl-btn danger" id="btnClearFinished">Clear finished</button>
                </div>
            </div>
        </header>

        <div class="dl-filter-bar">
            <div class="dl-filter-inner">
                <div class="dl-chips" id="dlFilterChips">
                    <button type="button" class="dl-chip active" data-filter="all">All</button>
                    <button type="button" class="dl-chip" data-filter="active">In progress</button>
                    <button type="button" class="dl-chip" data-filter="completed">Completed</button>
                    <button type="button" class="dl-chip" data-filter="stopped">Stopped</button>
                </div>
                <span class="dl-dir-hint" id="dlDirHint"></span>
            </div>
        </div>

        <main class="dl-main">
            <div class="dl-list" id="dlList"></div>
            <div class="dl-empty" id="dlEmpty" style="display: none;">
                <svg width="32" height="32" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 2.2v7.6M5 7.2L8 10.2l3-3M2.8 12.6h10.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="dl-empty-title" id="dlEmptyTitle">No downloads yet</div>
                <div class="dl-empty-sub" id="dlEmptySub">Files you download or screenshots you capture appear here</div>
            </div>
        </main>
    </div>

    <script>
__FNX_DOWNLOADS_JS__
    </script>
</body>
</html>
